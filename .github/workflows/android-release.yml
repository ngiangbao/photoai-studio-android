name: Build & Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit, version-pinned Android SDK setup rather than relying on whatever happens
      # to be preinstalled on the runner image - installs platform 34 / build-tools and
      # accepts licenses so the build doesn't depend on runner-image assumptions.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      # No gradlew/gradle-wrapper.jar is committed (nothing in this repo needs it to build),
      # so Gradle itself is provisioned by this action and invoked directly below.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      # The sandbox that authors this repo can't reach Actions' blob-storage log
      # backend, so on failure we re-surface the actual Gradle error as a workflow
      # annotation (visible via the Checks/annotations REST API) instead of only
      # the generic "exit code 1" the job-status API already shows.
      - name: Report build failure details
        if: steps.build.outcome == 'failure'
        run: |
          MSG=$(tail -n 80 build.log | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::$MSG"
          exit 1

      - name: Rename APK for release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PhotoAIStudio-android-alpha-001.apk

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAIStudio-android-apk
          path: dist/PhotoAIStudio-android-alpha-001.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PhotoAI Studio Android ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/PhotoAIStudio-android-alpha-001.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
