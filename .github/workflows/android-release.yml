name: Android Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Every push first goes through version-bump.yml, which bumps
    # version.json and re-pushes tagged "[skip version-bump]". Building only
    # on that follow-up commit (or a manual dispatch) means the APK always
    # carries the just-bumped version instead of racing version-bump.yml and
    # shipping a release one version behind.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[skip version-bump]')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: appver
        run: |
          VERSION=$(node -p "require('./version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Optional: a stable signing identity so each APK can be installed
      # over the previous one instead of requiring an uninstall first. Set
      # these 4 repo secrets (Settings -> Secrets and variables -> Actions)
      # to enable it; without them the build still succeeds, just signed
      # with Android's auto-generated debug key instead (see build.gradle).
      - name: Decode release keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/PhotoAIStudio-${{ steps.appver.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAIStudio-${{ steps.appver.outputs.version }}
          path: out/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appver.outputs.version }}
          name: PhotoAI Studio ${{ steps.appver.outputs.version }}
          body: |
            Bản build Android tự động cho phiên bản `${{ steps.appver.outputs.version }}`.

            Tải file APK dưới đây và cài trực tiếp trên điện thoại Android
            (cần cho phép "Cài đặt từ nguồn không xác định" khi cài lần đầu).

            Đây là dự án vibe coding - xem README.md để biết thêm chi tiết.
          files: out/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: false
